<div id="subFilterBar" class="sub-filter-bar"></div>

  <!-- Hub de 6 tarjetas de acceso rápido -->
  <section id="hubSection" class="hub-container">
    <div class="hub-grid">
      <div class="hub-card" onclick="selectHubCategory('agents')">
        <div class="hub-card-content">
          <h3>Agentes</h3>
          <p>Explora todos los personajes y roles</p>
        </div>
      </div>
      <div class="hub-card" onclick="selectHubCategory('weapons')">
        <div class="hub-card-content">
          <h3>Armas</h3>
          <p>Estadísticas de rifles, pistolas y más</p>
        </div>
      </div>
      <div class="hub-card" onclick="selectHubCategory('maps')">
        <div class="hub-card-content">
          <h3>Mapas</h3>
          <p>Estrategias y llamadas de ubicación</p>
        </div>
      </div>
      <div class="hub-card" onclick="selectHubCategory('playercards')">
        <div class="hub-card-content">
          <h3>Tarjetas</h3>
          <p>Galería de tarjetas de jugador</p>
        </div>
      </div>
      <div class="hub-card" onclick="selectHubCategory('buddies')">
        <div class="hub-card-content">
          <h3>Llaveros</h3>
          <p>Accesorios cosméticos para tus armas</p>
        </div>
      </div>
      <div class="hub-card" onclick="selectHubCategory('sprays')">
        <div class="hub-card-content">
          <h3>Graffitis</h3>
          <p>Sprays y marcas en el mapa</p>
        </div>
      </div>
    </div>

  <main class="main-content">
    <div id="contentGrid" class="content-grid"></div>
