<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valorant Database & Player Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Incluir Chart.js para gráficos de progresión -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Header y Navegación Principal -->
  <header class="top-bar">
    <div class="logo-container">
      <h1 style="cursor: pointer;" onclick="returnToCatalog()">VALORANT <span>HUB</span></h1>
    </div>

    <div class="controls-container">
      <select id="categorySelect" class="styled-select">
        <option value="agents">Agentes</option>
        <option value="playercards">Tarjetas de Jugador</option>
        <option value="weapons">Armas</option>
        <option value="sprays">Graffitis</option>
        <option value="buddies">Llaveros</option>
        <option value="maps">Mapas</option>
      </select>

      <select id="langSelect" class="styled-select">
        <option value="es-ES">Español (España)</option>
        <option value="es-MX">Español (México)</option>
        <option value="en-US">English (US)</option>
        <option value="de-DE">Deutsch</option>
        <option value="fr-FR">Français</option>
        <option value="it-IT">Italiano</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="pl-PL">Polski</option>
        <option value="pt-BR">Português (Brasil)</option>
        <option value="ru-RU">Русский</option>
        <option value="tr-TR">Türkçe</option>
        <option value="zh-CN">中文 (简体)</option>
        <option value="zh-TW">中文 (繁體)</option>
        <option value="ar-AE">العربية</option>
        <option value="id-ID">Bahasa Indonesia</option>
        <option value="th-TH">ไทย</option>
        <option value="vi-VN">Tiếng Việt</option>
      </select>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por nombre..." />
      </div>

      <button id="favFilterBtn" class="action-icon-btn" title="Ver Favoritos">♥</button>
      <button id="playerSearchToggleBtn" class="action-icon-btn" title="Buscar Jugador">🔍 Jugadores</button>
      
      <button id="openAuthModalBtn" class="action-icon-btn auth-nav-btn" title="Mi Cuenta y Favoritos">
        👤 <span id="authButtonText">Mi Cuenta</span>
      </button>
    </div>
  </header>

  <div id="subFilterBar" class="sub-filter-bar"></div>

  <main class="main-content">
    <div id="contentGrid" class="content-grid"></div>
  </main>

  <!-- Barra flotante dual: Sirve tanto para Armas como para Comparación de Jugadores -->
  <div id="compareFloatingBar" class="compare-floating-bar" style="display: none;">
    <span id="compareCountText">0/2 seleccionados</span>
    <button id="openCompareBtn" disabled>Comparar</button>
    <button id="clearCompareBtn" class="secondary">Limpiar</button>
  </div>

  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="compareModal" class="modal">
    <div class="modal-content large">
      <span id="closeCompareModal" class="close-btn">&times;</span>
      <div id="compareModalBody"></div>
    </div>
  </div>

  <div id="authModal" class="modal">
    <div class="modal-content auth-modal-box">
      <span id="closeAuthModal" class="close-btn">&times;</span>
      
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #fff; letter-spacing: 2px;">PERFIL DE AGENTE</h2>
        <p id="authSubtitle" style="font-size: 12px; color: #888;">Gestiona tu cuenta y accede a tus colecciones</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" onclick="switchAuthTab('profile', event)">Mi Perfil</button>
        <button class="auth-tab-btn" onclick="switchAuthTab('login', event)">Acceso</button>
        <button class="auth-tab-btn" onclick="switchAuthTab('register', event)">Registro</button>
      </div>

      <div id="authFormContainer"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
